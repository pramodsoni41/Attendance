<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Attendance</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f4f6f8;
  font-family: Arial;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 14px;
  width: 360px;              /* 🔥 wider */
  text-align: center;
  box-shadow: 0 12px 30px rgba(0,0,0,0.12);
}

h3 {
  margin-bottom: 15px;
  color: #2563eb;
  font-size: 22px;           /* 🔥 bigger title */
}

#status {
  margin-top: 10px;
  min-height: 28px;
  font-weight: bold;
  font-size: 16px;           /* 🔥 bigger message */
}

/* 🔥 BIG INPUT */
input {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 18px;           /* 🔥 big text */
  text-align: center;
}

/* 🔥 BIG BUTTON */
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;           /* 🔥 big text */
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1e4ed8;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="card">
  <h3>Attendance</h3>

  <div id="status">Initializing...</div>

</div>

<script>

/* ================= CONFIG ================= */
const API = "https://script.google.com/macros/s/AKfycbx8szkkZi7WFwlqCeh00HFAjw67G3zSsukj77LEC0iI4g6xnlXeUYoTbbcoXU1BsiBV/exec";

/* ================= CLASSROOM SESSION ================= */
const AUTH = {
  sessionToken: localStorage.getItem("student_session_token") || "",
  roll:         localStorage.getItem("student_roll")          || "",
  name:         localStorage.getItem("student_name")          || "",
  ok: !!(localStorage.getItem("student_session_token") || localStorage.getItem("student_roll"))
};

/* ================= ELEMENTS ================= */
const status = document.getElementById("status");
const form = document.getElementById("formSection");
const rollInput = document.getElementById("rollNo");
const submitBtn = document.getElementById("submitBtn");
let gps = {
  lat: "",
  lon: ""
};
let isProcessing = false;
let isResponseReceived = false;   // 🔥 ADD THIS
/* ================= PARSE QR ================= */
function parseQR(raw){
  if(!raw) return null;
  const p = raw.split('|');
  if(p.length < 4) return null;

  return {
    session: p[0],
    time: p[1],
    token: p[2],
    sig: p[3]
  };
}

/* ================= JSONP ================= */
function call(url, cb, done){
isResponseReceived = false;
  const script = document.createElement("script");

  window[cb] = function(res){
    isResponseReceived = true;   // 🔥 ADD THIS
    delete window[cb];
    script.remove();
    done(res);
  };

  script.onerror = function(){
     isProcessing = false;
    delete window[cb];
    script.remove();
    setStatus("❌ Network Error", "red");
  };

  // ✅ THIS IS THE FIX
  script.src = url + "&callback=" + cb;

  document.body.appendChild(script);

  // ✅ TIMEOUT SAFETY (VERY IMPORTANT)
setTimeout(() => {
  if (!isResponseReceived) {
    setStatus("⏳ Still verifying...", "black");
  }
}, 5000);
}

/* ================= UI HELPER ================= */
function setStatus(msg, color="black"){
  status.style.color = color;
  status.innerHTML = msg;
}


/* ================= AUTO ATTEND ================= */
function auto(){
  if (isProcessing) return;

  if (localStorage.getItem("done") === "1") return;

  // Block if not logged into classroom
  if (!AUTH.ok) {
    setStatus("🔒 Please login to the <a href='https://pramodsoni.in/classroom/' style='color:#2563eb'>Classroom Portal</a> first, then scan QR again.", "red");
    return;
  }

  isProcessing = true;
  setStatus("Verifying...", "black");

  const payload = localStorage.getItem("qr");
  const scanTime = localStorage.getItem("scan_time");
  const device = localStorage.getItem("device");

  if (!payload) {
    setStatus("⚠️ Scan QR first", "black");
    isProcessing = false;
    return;
  }

  const q = parseQR(payload);
  if (!q) {
    setStatus("❌ Invalid QR", "red");
    isProcessing = false;
    return;
  }

  const cb = "auto_" + Date.now();

  const url = API
    + "?type=mark_attendance"
    + "&student_id=" + encodeURIComponent(AUTH.roll)
    + "&session_token=" + encodeURIComponent(AUTH.sessionToken)
    + "&session_id=" + q.session
    + "&token=" + q.token
    + "&timestamp=" + q.time
    + "&scan_time=" + scanTime
    + "&signature=" + q.sig
    + "&device_id=" + device
    + "&lat=" + gps.lat
    + "&lon=" + gps.lon;

  call(url, cb, function(res){
    isProcessing = false;
    if (!res || !res.status) {
      setStatus("❌ Server Error", "red");
      return;
    }

    if (res.status === "success") {
      localStorage.setItem("done", "1");
      if (res.duplicate) {
        setStatus("⚠️ Already marked: <b>" + res.name + "</b>", "orange");
      } else {
        setStatus("✅ Attendance marked: <b>" + res.name + "</b>", "green");
      }
      form.classList.add("hidden");
      localStorage.removeItem("qr");
      localStorage.removeItem("scan_time");
    }

    else if (res.status === "register_required") {
      // Shouldn't happen for Google-login users, but fallback
      setStatus("⚠️ Student not found. Contact instructor.", "red");
    }

    else if (res.status === "device_already_registered") {
      setStatus("🚫 Device mismatch. Contact instructor.", "red");
    }

    else {
      setStatus("❌ " + (res.message || res.status), "red");
    }
  });
}


/* ================= INIT ================= */
window.onload = function(){

  // Use device ID from classroom login if available, otherwise generate one
  const classroomDeviceId = localStorage.getItem("device_id");
  if (classroomDeviceId) {
    localStorage.setItem("device", classroomDeviceId);
  } else if (!localStorage.getItem("device")) {
    localStorage.setItem("device", "DEV-" + Math.random().toString(36).slice(2, 8));
  }

  // read QR
  const p = new URLSearchParams(location.search).get("p");

  if(p){
    localStorage.removeItem("done");
    localStorage.setItem("qr", p);
    localStorage.setItem("scan_time", Math.floor(Date.now()/1000));
  }
// 🔥 SAFE GPS CALL (after load)

  if (!navigator.geolocation) {
    setStatus("❌ GPS not supported on this device. Use a smartphone.", "red");
    return;
  }

  setStatus("📍 Getting your location...", "black");

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      gps.lat = pos.coords.latitude.toFixed(6);
      gps.lon = pos.coords.longitude.toFixed(6);
      auto();
    },
    (err) => {
      // GPS denied or unavailable — block attendance
      const messages = {
        1: "❌ Location access denied. Enable GPS permission and refresh.",
        2: "❌ Location unavailable. Move to an open area and refresh.",
        3: "❌ Location timed out. Refresh and try again."
      };
      setStatus(messages[err.code] || "❌ GPS error. Enable location and refresh.", "red");
    },
    {
      enableHighAccuracy: false,
      timeout: 20000,
      maximumAge: 120000
    }
  );
};



</script>

</body>
</html>
