<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QR Generator</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #1d4ed8, #38bdf8);
  font-family: 'Segoe UI', Arial, sans-serif;
  padding: 16px;
}
.card {
  background: white;
  border-radius: 18px;
  box-shadow: 0 20px 48px rgba(0,0,0,0.18);
  padding: 28px 24px;
  width: 420px;
  max-width: 100%;
  text-align: center;
}
h2 {
  margin: 0 0 6px;
  color: #1d4ed8;
  font-size: 20px;
}
#statusBar {
  font-size: 13px;
  color: #64748b;
  margin-bottom: 18px;
}
#setupSection { display: block; }
#qrSection    { display: none; }

select, input[type=text], input[type=password] {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #cbd5e1;
  border-radius: 9px;
  font-size: 15px;
  margin-bottom: 12px;
  color: #1e293b;
}
select:focus, input:focus {
  outline: none;
  border-color: #2563eb;
}
button {
  width: 100%;
  padding: 12px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
button:hover { background: #1d4ed8; }
#errMsg { color: #ef4444; font-size: 13px; margin-top: 8px; min-height: 20px; }

#timerBar {
  height: 6px;
  background: #e2e8f0;
  border-radius: 3px;
  margin: 14px 0 8px;
  overflow: hidden;
}
#timerFill {
  height: 100%;
  background: #10b981;
  border-radius: 3px;
  transition: width 1s linear, background 0.3s;
}
#countdown {
  font-size: 13px;
  color: #64748b;
  margin-bottom: 10px;
}
canvas { border-radius: 8px; }
#zoomSlider { width: 100%; margin-top: 14px; }
#sessionLabel {
  display: inline-block;
  background: #eff6ff;
  color: #1d4ed8;
  font-weight: 700;
  font-size: 13px;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 12px;
}
</style>
</head>
<body>

<div class="card">
  <h2>Attendance QR Generator</h2>
  <div id="statusBar">Loading sessions...</div>

  <!-- Setup -->
  <div id="setupSection">
    <input type="password" id="passInput" placeholder="Admin Password">
    <select id="sessionSelect"><option value="">Loading sessions...</option></select>
    <button onclick="startQR()">Generate QR</button>
    <div id="errMsg"></div>
  </div>

  <!-- QR Display -->
  <div id="qrSection">
    <div id="sessionLabel"></div>
    <div id="timerBar"><div id="timerFill" style="width:100%"></div></div>
    <div id="countdown">--s remaining</div>
    <canvas id="qr"></canvas>
    <input type="range" min="200" max="700" value="360" id="zoomSlider">
    <button onclick="resetPage()" style="margin-top:14px;background:#64748b;">Change Session</button>
  </div>
</div>

<script>
const API_URL    = "https://script.google.com/macros/s/AKfycbzn8KyaowmYk0dOD_FrRhIHXPS22JLybTkRleCa7WVnig0zgUQ7jZMH8NFOJV2MZwRD/exec";
const PORTAL_URL = "https://pramodsoni.in/Attendance/";

let QR_VALIDITY_MS = 40000;
const LEAD_TIME_MS = 3000;
let ADMIN_PASS = "";   // held in memory only; verified server-side, never fetched
let SESSION_ID = "";
let qrTimeout  = null;
let countdownInterval = null;
let lastQR     = null;
let timeOffset = 0;

/* ===== JSONP ===== */
function jsonp(url, cb, success, fail) {
  const script = document.createElement("script");
  window[cb] = (data) => { delete window[cb]; script.remove(); success(data); };
  script.onerror = () => { delete window[cb]; script.remove(); if (fail) fail(); };
  script.src = url + "&callback=" + cb;
  document.body.appendChild(script);
}

/* ===== LOAD SESSIONS ON PAGE LOAD ===== */
function loadSessions() {
  jsonp(`${API_URL}?type=get_sessions`, "sess_" + Date.now(), (res) => {
    const sel = document.getElementById("sessionSelect");
    if (res.status === "success" && res.sessions.length) {
      sel.innerHTML = res.sessions.map(s => `<option value="${s}">${s}</option>`).join("");
      document.getElementById("statusBar").textContent = "Enter password and select session.";
    } else {
      sel.innerHTML = '<option value="">No sessions in Config sheet</option>';
      document.getElementById("statusBar").textContent = "Add sessions to Config sheet.";
    }
  }, () => {
    document.getElementById("sessionSelect").innerHTML = '<option value="">Could not load sessions</option>';
    document.getElementById("statusBar").textContent = "Could not reach server.";
  });

}

/* ===== START ===== */
function startQR() {
  const err = document.getElementById("errMsg");
  const passInput = document.getElementById("passInput").value.trim();

  if (!passInput) { err.textContent = "Enter the admin password."; return; }

  SESSION_ID = document.getElementById("sessionSelect").value;
  if (!SESSION_ID) { err.textContent = "Select a session first."; return; }

  // Password is checked by the server on the first generate_qr call
  ADMIN_PASS = passInput;
  err.textContent = "Verifying...";
  fetchQR(true);
}

/* Called when the server rejects the admin password */
function onBadPassword() {
  ADMIN_PASS = "";
  if (qrTimeout) clearTimeout(qrTimeout);
  if (countdownInterval) clearInterval(countdownInterval);
  document.getElementById("qrSection").style.display    = "none";
  document.getElementById("setupSection").style.display = "block";
  document.getElementById("errMsg").textContent = "Wrong password.";
  document.getElementById("passInput").value = "";
  document.getElementById("passInput").focus();
}

/* ===== FETCH QR ===== */
function fetchQR(isFirst) {
  jsonp(`${API_URL}?type=generate_qr&session_id=${encodeURIComponent(SESSION_ID)}&admin_pass=${encodeURIComponent(ADMIN_PASS)}`,
    "qr_" + Date.now(),
    (data) => {
      if (data.status === "bad_admin_pass") { onBadPassword(); return; }
      if (data.status !== "success") { qrTimeout = setTimeout(fetchQR, 2000); return; }

      if (isFirst) {
        // Password accepted — reveal the QR screen
        document.getElementById("errMsg").textContent = "";
        document.getElementById("setupSection").style.display = "none";
        document.getElementById("qrSection").style.display    = "block";
        document.getElementById("sessionLabel").textContent   = `Session: ${SESSION_ID}`;
      }

      QR_VALIDITY_MS = data.validity_sec * 1000;
      timeOffset = data.server_time - Date.now();
      const payload  = data.qr_payload;
      const fullLink = `${PORTAL_URL}?p=${encodeURIComponent(payload)}`;
      const parts    = payload.split("|");
      lastQR = { timestamp: parseInt(parts[1]) * 1000, raw: payload };
      renderQR(fullLink);
      scheduleNext();
      startCountdown();
    },
    () => { qrTimeout = setTimeout(fetchQR, 3000); }
  );
}

/* ===== RENDER ===== */
function renderQR(link) {
  const size = parseInt(document.getElementById("zoomSlider").value);
  QRCode.toCanvas(document.getElementById("qr"), link, {
    width: size, margin: 1, errorCorrectionLevel: "H"
  });
}

/* ===== SCHEDULING ===== */
function scheduleNext() {
  if (qrTimeout) clearTimeout(qrTimeout);
  const now    = Date.now() + timeOffset;
  const expiry = lastQR.timestamp + QR_VALIDITY_MS;
  const delay  = Math.max(1000, (expiry - now) - LEAD_TIME_MS);
  qrTimeout = setTimeout(fetchQR, delay);
}

/* ===== COUNTDOWN ===== */
function startCountdown() {
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    if (!lastQR) return;
    const now      = Date.now() + timeOffset;
    const expiry   = lastQR.timestamp + QR_VALIDITY_MS;
    const remaining = Math.max(0, Math.floor((expiry - now) / 1000));
    const pct      = Math.max(0, (expiry - now) / QR_VALIDITY_MS * 100);
    document.getElementById("countdown").textContent = `${remaining}s remaining`;
    const fill = document.getElementById("timerFill");
    fill.style.width = pct + "%";
    fill.style.background = pct > 40 ? "#10b981" : pct > 15 ? "#f59e0b" : "#ef4444";
  }, 1000);
}

/* ===== ZOOM ===== */
document.getElementById("zoomSlider").oninput = function() {
  if (!lastQR) return;
  renderQR(`${PORTAL_URL}?p=${encodeURIComponent(lastQR.raw)}`);
};

/* ===== RESET ===== */
function resetPage() {
  if (qrTimeout) clearTimeout(qrTimeout);
  if (countdownInterval) clearInterval(countdownInterval);
  lastQR = null;
  document.getElementById("qrSection").style.display    = "none";
  document.getElementById("setupSection").style.display = "block";
  document.getElementById("passInput").value = "";
}

document.addEventListener("DOMContentLoaded", loadSessions);
</script>
</body>
</html>
