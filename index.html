<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Attendance</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #1d4ed8, #38bdf8);
  font-family: 'Segoe UI', Arial, sans-serif;
  padding: 16px;
}
.card {
  background: white;
  padding: 32px 28px;
  border-radius: 18px;
  width: 360px;
  max-width: 100%;
  text-align: center;
  box-shadow: 0 20px 48px rgba(0,0,0,0.18);
}
h3 {
  margin: 0 0 20px;
  color: #1d4ed8;
  font-size: 22px;
  font-weight: 700;
}
#status {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  min-height: 32px;
  color: #1e293b;
}
#spinner {
  margin: 16px auto 0;
  width: 32px; height: 32px;
  border: 3px solid #e2e8f0;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <h3>📋 Attendance</h3>
  <div id="status">Initializing...</div>
  <div id="spinner"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzn8KyaowmYk0dOD_FrRhIHXPS22JLybTkRleCa7WVnig0zgUQ7jZMH8NFOJV2MZwRD/exec";

const AUTH = {
  sessionToken: localStorage.getItem("student_session_token") || "",
  roll:         localStorage.getItem("student_roll")          || "",
  name:         localStorage.getItem("student_name")          || "",
  ok: !!(localStorage.getItem("student_session_token") || localStorage.getItem("student_roll"))
};

const statusEl  = document.getElementById("status");
const spinnerEl = document.getElementById("spinner");
let isProcessing = false;
let gps = { lat: "", lon: "" };

function setStatus(msg, color) {
  statusEl.style.color  = color || "#1e293b";
  statusEl.innerHTML    = msg;
  spinnerEl.style.display = "none";
}

function showSpinner(msg) {
  statusEl.style.color  = "#64748b";
  statusEl.innerHTML    = msg;
  spinnerEl.style.display = "block";
}

function parseQR(raw) {
  if (!raw) return null;
  const p = raw.split("|");
  return p.length >= 4 ? { session: p[0], time: p[1], token: p[2], sig: p[3] } : null;
}

/* JSONP with timeout + retry */
function jsonpCall(url, cb, done) {
  const script = document.createElement("script");
  let settled  = false;

  const cleanup = () => { delete window[cb]; script.remove(); };

  const timer = setTimeout(() => {
    if (settled) return;
    settled = true;
    cleanup();
    done(null, "timeout");
  }, 8000);

  window[cb] = (res) => {
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    cleanup();
    done(res);
  };

  script.onerror = () => {
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    cleanup();
    done(null, "network");
  };

  script.src = url + "&callback=" + cb;
  document.body.appendChild(script);
}

function auto() {
  if (isProcessing) return;

  if (localStorage.getItem("done") === "1") {
    setStatus("✅ Attendance already marked for this session.", "green");
    return;
  }

  if (!AUTH.ok) {
    setStatus("🔒 Please login to the <a href='https://pramodsoni.in/classroom/' style='color:#2563eb;font-weight:600'>Classroom Portal</a> first, then scan QR again.", "#ef4444");
    return;
  }

  const payload = localStorage.getItem("qr");
  if (!payload) { setStatus("⚠️ No QR found. Scan the QR code first.", "#f59e0b"); return; }

  const q = parseQR(payload);
  if (!q) { setStatus("❌ Invalid QR code.", "#ef4444"); return; }

  isProcessing = true;
  showSpinner("Verifying attendance...");

  const device = localStorage.getItem("device") || "";
  const url = API
    + "?type=mark_attendance"
    + "&student_id="     + encodeURIComponent(AUTH.roll)
    + "&session_token="  + encodeURIComponent(AUTH.sessionToken)
    + "&session_id="     + encodeURIComponent(q.session)
    + "&token="          + encodeURIComponent(q.token)
    + "&timestamp="      + encodeURIComponent(q.time)
    + "&signature="      + encodeURIComponent(q.sig)
    + "&device_id="      + encodeURIComponent(device)
    + "&lat="            + gps.lat
    + "&lon="            + gps.lon;

  jsonpCall(url, "att_" + Date.now(), (res, err) => {
    isProcessing = false;

    if (!res) {
      setStatus(err === "timeout"
        ? "⏳ Server is slow. Please try scanning again."
        : "❌ Network error. Check your connection.", "#ef4444");
      return;
    }

    if (res.status === "success") {
      localStorage.setItem("done", "1");
      localStorage.removeItem("qr");
      localStorage.removeItem("scan_time");
      setStatus(res.duplicate
        ? "⚠️ Already marked: <b>" + (res.name || AUTH.name) + "</b>"
        : "✅ Marked: <b>" + (res.name || AUTH.name) + "</b>",
        res.duplicate ? "#f59e0b" : "green");
    } else if (res.status === "register_required") {
      setStatus("⚠️ Student not found. Contact instructor.", "#ef4444");
    } else if (res.status === "device_already_registered") {
      setStatus("🚫 Device mismatch. Contact instructor.", "#ef4444");
    } else if (res.status === "qr_stale" || res.status === "expired") {
      setStatus("⏰ QR expired. Ask instructor to refresh.", "#f59e0b");
    } else {
      setStatus("❌ " + (res.message || res.status), "#ef4444");
    }
  });
}

window.onload = function () {
  /* Device ID */
  if (!localStorage.getItem("device")) {
    localStorage.setItem("device", "DEV-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  }

  /* Read QR from URL */
  const p = new URLSearchParams(location.search).get("p");
  if (p) {
    localStorage.removeItem("done");
    localStorage.setItem("qr", p);
    localStorage.setItem("scan_time", Math.floor(Date.now() / 1000));
  }

  /* GPS — mandatory */
  if (!navigator.geolocation) {
    setStatus("❌ GPS not supported. Use a smartphone.", "#ef4444");
    return;
  }

  showSpinner("📍 Getting your location...");

  const onOK = (pos) => {
    gps.lat = pos.coords.latitude.toFixed(6);
    gps.lon = pos.coords.longitude.toFixed(6);
    auto();
  };
  const onFail = (err) => {
    const msg = {
      1: "❌ Location denied. Enable GPS and refresh.",
      2: "❌ Location unavailable. Move to an open area.",
      3: "❌ Location timed out. Refresh and try again."
    };
    setStatus(msg[err && err.code] || "❌ GPS error.", "#ef4444");
  };

  // Try a real satellite fix first (no cached position); if that fails
  // (e.g. deep indoors with no GPS chip signal), fall back to coarse location.
  navigator.geolocation.getCurrentPosition(
    onOK,
    () => navigator.geolocation.getCurrentPosition(
      onOK, onFail,
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 0 }
    ),
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
};
</script>
</body>
</html>
